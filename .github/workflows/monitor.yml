# Monitor and Deploy
#
# monitor job:
#   - checks out main (source + scripts)
#   - checks out the `data` branch into ./data-branch (status.json, history.json)
#   - runs check.py, pointing it at ./data-branch/ via env vars
#   - force-pushes the two updated JSON files back to origin/data
#
# deploy job:
#   - checks out main (source)
#   - checks out `data` branch into ./data-branch
#   - copies JSON files into public/, uploads public/ as the Pages artifact
#   - deploys to GitHub Pages
#
# The `data` branch is force-pushed on every run; its git history is disposable.
# status.json and history.json never touch main, so PRs against main cannot
# conflict on those files.

name: Monitor and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes

permissions:
  contents: write   # push to data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      overall: ${{ steps.check.outputs.overall }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run status checker
        id: check
        env:
          STATUS_JSON_PATH: data-branch/status.json
          HISTORY_JSON_PATH: data-branch/history.json
        run: python scripts/check.py

      - name: Push updated data to data branch
        run: |
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update status data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          git push --force origin HEAD:data

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 1

      - name: Assemble site
        run: |
          cp data-branch/status.json  public/status.json
          cp data-branch/history.json public/history.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
