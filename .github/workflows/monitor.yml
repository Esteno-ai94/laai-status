# This is the only GitHub Pages deployment workflow for this repo.
# The published site root is the `public/` directory, uploaded as the Pages artifact.
# Monitor esteno.io and deploy status page; runs on schedule (every 10 min) and on manual dispatch.

name: Monitor and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes

permissions:
  contents: write   # push updated status/history
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      overall: ${{ steps.check.outputs.overall }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --upgrade pip requests

      - name: Run status checker
        id: check
        run: python scripts/check.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/status.json public/history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update status and history [skip ci]"
          git push || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
