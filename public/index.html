<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAAI Status</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LAAI Status</h1>
      <p class="subtitle">Service status for <a href="https://esteno.io">esteno.io</a></p>
    </header>

    <section class="overall" aria-live="polite">
      <h2>Overall status</h2>
      <div id="overall-badge" class="badge">—</div>
      <p id="last-checked" class="last-checked">Last checked: —</p>
    </section>

    <section class="uptime">
      <h2>Uptime</h2>
      <div class="uptime-cards">
        <div class="uptime-card">
          <span class="uptime-value" id="uptime-24h">—</span>
          <span class="uptime-label">Last 24 hours</span>
        </div>
        <div class="uptime-card">
          <span class="uptime-value" id="uptime-7d">—</span>
          <span class="uptime-label">Last 7 days</span>
        </div>
      </div>
    </section>

    <section class="services">
      <h2>Services</h2>
      <div id="services-list" class="services-list">
        <!-- Filled by app.js -->
      </div>
    </section>

    <section class="incidents">
      <h2>Recent incidents</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time (UTC)</th>
              <th>Service</th>
              <th>Status</th>
              <th>HTTP</th>
              <th>Response</th>
            </tr>
          </thead>
          <tbody id="incidents-body">
            <tr><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      <p>Updated by GitHub Actions every 10 minutes.</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
